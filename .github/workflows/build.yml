name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "VCTS-Helper-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VCTS-Helper-apk
          path: VCTS-Helper-*.apk

      - name: Publish the APK on the "apk" branch
        run: |
          mkdir out && cp VCTS-Helper-*.apk out/VCTS-Helper.apk
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add VCTS-Helper.apk
          git commit -q -m "APK build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
