plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'np.kamana.vcts'
    compileSdk 34

    defaultConfig {
        applicationId "np.kamana.vcts"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    signingConfigs {
        // A fixed key so each new APK installs over the previous one.
        release {
            storeFile file('vcts-helper.jks')
            storePassword 'vctshelper'
            keyAlias 'vcts'
            keyPassword 'vctshelper'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
